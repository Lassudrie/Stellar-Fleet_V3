<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stellar Fleet 3D</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #05070c;
        font-family: 'Space Grotesk', 'IBM Plex Sans Condensed', 'Trebuchet MS', sans-serif;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      .hud {
        position: fixed;
        left: 18px;
        top: 18px;
        z-index: 2;
        pointer-events: none;
      }

      .menu-screen {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        z-index: 3;
        background: radial-gradient(circle at 20% 20%, rgba(24, 53, 88, 0.45), transparent 55%),
          radial-gradient(circle at 80% 10%, rgba(72, 36, 63, 0.28), transparent 45%),
          linear-gradient(160deg, rgba(5, 7, 12, 0.98), rgba(6, 9, 16, 0.92));
      }

      .hidden {
        display: none;
      }

      .panel {
        pointer-events: auto;
        width: min(340px, 92vw);
        padding: 16px 18px 18px;
        border-radius: 16px;
        border: 1px solid rgba(93, 120, 156, 0.35);
        background: linear-gradient(135deg, rgba(11, 15, 24, 0.92), rgba(8, 12, 20, 0.84));
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55);
        color: #e6edf3;
      }

      .menu-panel {
        width: min(420px, 92vw);
      }

      .panel.slim {
        width: min(300px, 86vw);
        padding: 12px 14px;
      }

      .panel h1 {
        margin: 0 0 4px;
        font-size: 18px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #b7e4ff;
      }

      .debug-overlay {
        position: fixed;
        right: 16px;
        top: 16px;
        z-index: 4;
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid rgba(93, 120, 156, 0.35);
        background: rgba(6, 10, 18, 0.82);
        color: rgba(216, 231, 246, 0.9);
        font-size: 11px;
        line-height: 1.4;
        white-space: pre;
        pointer-events: none;
      }

      .panel p {
        margin: 0 0 12px;
        font-size: 13px;
        line-height: 1.4;
        color: rgba(230, 237, 243, 0.7);
      }

      .menu-eyebrow {
        font-size: 11px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: rgba(230, 237, 243, 0.55);
      }

      .panel label {
        display: block;
        margin-top: 10px;
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(230, 237, 243, 0.75);
      }

      .panel .field-group {
        margin-top: 10px;
      }

      .panel select,
      .panel input {
        width: 100%;
        margin-top: 6px;
        padding: 8px 10px;
        border-radius: 10px;
        border: 1px solid rgba(78, 98, 128, 0.6);
        background: rgba(8, 12, 18, 0.9);
        color: #f8fafc;
        font-size: 14px;
        outline: none;
      }

      .panel input[type='range'] {
        padding: 0;
        accent-color: #7dd3fc;
      }

      .range-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .range-value {
        min-width: 44px;
        text-align: right;
        font-variant-numeric: tabular-nums;
        color: #d9f2ff;
      }

      .actions {
        display: flex;
        gap: 10px;
        margin-top: 14px;
      }

      .panel button {
        flex: 1;
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid rgba(125, 211, 252, 0.5);
        background: linear-gradient(130deg, rgba(37, 99, 235, 0.18), rgba(14, 116, 144, 0.35));
        color: #e6edf3;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        cursor: pointer;
      }

      .panel button:hover {
        border-color: rgba(148, 219, 255, 0.75);
      }

      .hint {
        margin-top: 10px;
        font-size: 11px;
        color: rgba(230, 237, 243, 0.6);
      }

      @media (max-width: 720px) {
        .hud {
          left: 12px;
          right: 12px;
          top: auto;
          bottom: 12px;
        }

        .menu-panel {
          width: min(360px, 92vw);
        }

        .panel {
          width: auto;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="galaxy"></canvas>
    <div id="menu-screen" class="menu-screen">
      <div class="panel menu-panel">
        <div class="menu-eyebrow">Scenario Gate</div>
        <h1>Stellar Fleet</h1>
        <p id="scenario-description">Loading scenario...</p>
        <label for="scenario-select">Scenario</label>
        <select id="scenario-select"></select>
        <label for="seed-input">Seed</label>
        <input id="seed-input" type="number" step="1" />
        <label for="time-scale-menu">Time Scale (days/s)</label>
        <div class="range-row">
          <input id="time-scale-menu" type="range" min="-5" max="5" step="0.1" />
          <div class="range-value" id="time-scale-value-menu">0</div>
        </div>
        <div class="actions">
          <button id="start-button" type="button">Launch Mission</button>
        </div>
        <div class="hint">Pinch or scroll to zoom. Double tap to focus. Drag to orbit. Two-finger drag to pan.</div>
      </div>
    </div>
    <div id="hud" class="hud hidden">
      <div class="panel slim">
        <label for="time-scale-hud">Time Scale (days/s)</label>
        <div class="range-row">
          <input id="time-scale-hud" type="range" min="-5" max="5" step="0.1" />
          <div class="range-value" id="time-scale-value-hud">0</div>
        </div>
        <div class="actions">
          <button id="menu-button" type="button">Menu</button>
        </div>
        <div class="hint">Double tap to focus. Drag to orbit. Shift or right-drag to pan. Scroll or pinch to zoom.</div>
      </div>
    </div>
    <div id="debug-overlay" class="debug-overlay hidden"></div>
    <script type="module" src="/client.js"></script>
  </body>
</html>
