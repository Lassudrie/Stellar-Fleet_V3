<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stellar Fleet 3D</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #05070c;
        font-family: 'Space Grotesk', 'IBM Plex Sans Condensed', 'Trebuchet MS', sans-serif;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      .label-layer {
        position: fixed;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        font-family: 'Space Grotesk', 'IBM Plex Sans Condensed', 'Trebuchet MS', sans-serif;
        font-size: 11px;
        letter-spacing: 0.02em;
        text-transform: none;
      }

      .marker-layer {
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none;
      }

      .marker {
        position: absolute;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        transform: translate(-50%, -50%);
        background: rgba(204, 233, 255, 0.85);
        box-shadow: 0 0 10px rgba(120, 180, 255, 0.4);
      }

      .marker[data-kind='star'] {
        background: rgba(255, 234, 192, 0.9);
        box-shadow: 0 0 12px rgba(255, 210, 140, 0.5);
      }

      .marker[data-kind='moon'] {
        background: rgba(190, 198, 214, 0.85);
        box-shadow: 0 0 8px rgba(160, 170, 190, 0.45);
      }

      .label {
        position: absolute;
        transform: translate(-50%, -100%);
        color: rgba(230, 237, 243, 0.9);
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.65);
        white-space: nowrap;
        opacity: 1;
        transition: none;
      }

      .label[data-kind='star'] {
        color: rgba(255, 234, 192, 0.95);
      }

      .label[data-kind='planet'] {
        color: rgba(204, 233, 255, 0.92);
      }

      .label[data-kind='moon'] {
        color: rgba(190, 198, 214, 0.82);
        font-size: 10px;
        letter-spacing: 0.06em;
      }

      .menu-screen {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        z-index: 3;
        background: radial-gradient(circle at 20% 20%, rgba(24, 53, 88, 0.45), transparent 55%),
          radial-gradient(circle at 80% 10%, rgba(72, 36, 63, 0.28), transparent 45%),
          linear-gradient(160deg, rgba(5, 7, 12, 0.98), rgba(6, 9, 16, 0.92));
      }

      .loading-screen {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        z-index: 3;
        background: radial-gradient(circle at 30% 20%, rgba(20, 44, 74, 0.45), transparent 55%),
          radial-gradient(circle at 70% 0%, rgba(60, 32, 52, 0.3), transparent 50%),
          linear-gradient(160deg, rgba(5, 7, 12, 0.98), rgba(6, 10, 18, 0.94));
      }

      .hidden {
        display: none;
      }

      .loading-bar {
        width: 100%;
        height: 8px;
        border-radius: 999px;
        background: rgba(20, 30, 48, 0.8);
        border: 1px solid rgba(84, 115, 150, 0.45);
        overflow: hidden;
      }

      .loading-bar__fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(120deg, rgba(125, 211, 252, 0.2), rgba(125, 211, 252, 0.95));
        transition: width 0.2s ease;
      }

      .panel {
        pointer-events: auto;
        width: min(340px, 92vw);
        padding: 16px 18px 18px;
        border-radius: 16px;
        border: 1px solid rgba(93, 120, 156, 0.35);
        background: linear-gradient(135deg, rgba(11, 15, 24, 0.92), rgba(8, 12, 20, 0.84));
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55);
        color: #e6edf3;
      }

      .menu-panel {
        width: min(420px, 92vw);
      }

      .panel.slim {
        width: min(300px, 86vw);
        padding: 12px 14px;
      }

      .burger-button {
        position: fixed;
        top: 18px;
        left: 18px;
        z-index: 3;
        width: 44px;
        height: 44px;
        border-radius: 12px;
        border: 1px solid rgba(93, 120, 156, 0.45);
        background: rgba(10, 18, 28, 0.75);
        color: #e6edf3;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 5px;
        padding: 0;
      }

      .burger-button span {
        display: block;
        width: 18px;
        height: 2px;
        background: rgba(230, 237, 243, 0.9);
        border-radius: 999px;
        transition: transform 0.2s ease, opacity 0.2s ease;
      }

      .burger-button.is-active span:nth-child(1) {
        transform: translateY(6px) rotate(45deg);
      }

      .burger-button.is-active span:nth-child(2) {
        opacity: 0;
      }

      .burger-button.is-active span:nth-child(3) {
        transform: translateY(-6px) rotate(-45deg);
      }

      .burger-backdrop {
        position: fixed;
        inset: 0;
        z-index: 2;
        background: rgba(5, 8, 14, 0.65);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease;
      }

      .burger-backdrop.is-visible {
        opacity: 1;
        pointer-events: auto;
      }

      .burger-drawer {
        position: fixed;
        top: 0;
        left: 0;
        height: 100%;
        width: min(360px, 86vw);
        padding: 18px;
        box-sizing: border-box;
        z-index: 3;
        transform: translateX(-100%);
        transition: transform 0.2s ease;
        pointer-events: none;
      }

      .burger-drawer.is-open {
        transform: translateX(0);
        pointer-events: auto;
      }

      .burger-drawer .panel {
        width: 100%;
        max-height: calc(100vh - 36px);
        overflow: auto;
      }

      .panel h1 {
        margin: 0 0 4px;
        font-size: 18px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #b7e4ff;
      }

      .debug-overlay {
        position: fixed;
        right: 16px;
        top: 16px;
        z-index: 4;
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid rgba(93, 120, 156, 0.35);
        background: rgba(6, 10, 18, 0.82);
        color: rgba(216, 231, 246, 0.9);
        font-size: 11px;
        line-height: 1.4;
        white-space: pre;
        pointer-events: auto;
        max-width: min(360px, calc(100vw - 32px));
        max-height: calc(100vh - 32px);
        overflow: auto;
        box-sizing: border-box;
        -webkit-overflow-scrolling: touch;
      }

      .debug-overlay__toggle {
        position: absolute;
        right: 8px;
        top: 8px;
        padding: 2px 8px;
        border-radius: 999px;
        border: 1px solid rgba(120, 150, 190, 0.5);
        background: rgba(10, 18, 28, 0.9);
        color: rgba(216, 231, 246, 0.9);
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        cursor: pointer;
      }

      .debug-overlay__content {
        margin-top: 20px;
        pointer-events: none;
      }

      .debug-overlay.is-collapsed {
        padding: 8px 10px;
      }

      .debug-overlay.is-collapsed .debug-overlay__content {
        display: none;
      }

      .panel p {
        margin: 0 0 12px;
        font-size: 13px;
        line-height: 1.4;
        color: rgba(230, 237, 243, 0.7);
      }

      .menu-eyebrow {
        font-size: 11px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: rgba(230, 237, 243, 0.55);
      }

      .panel label {
        display: block;
        margin-top: 10px;
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(230, 237, 243, 0.75);
      }

      .panel .field-group {
        margin-top: 10px;
      }

      .panel select,
      .panel input {
        width: 100%;
        margin-top: 6px;
        padding: 8px 10px;
        border-radius: 10px;
        border: 1px solid rgba(78, 98, 128, 0.6);
        background: rgba(8, 12, 18, 0.9);
        color: #f8fafc;
        font-size: 14px;
        outline: none;
      }

      .panel input[type='range'] {
        padding: 0;
        accent-color: #7dd3fc;
      }

      .speed-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin-top: 6px;
      }

      .speed-value {
        min-width: 110px;
        text-align: right;
        font-variant-numeric: tabular-nums;
        color: #d9f2ff;
        margin-left: auto;
      }

      .speed-button {
        flex: 0 0 auto;
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid rgba(125, 211, 252, 0.35);
        background: rgba(12, 18, 28, 0.85);
        color: #cbd5e1;
        font-size: 12px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        cursor: pointer;
      }

      .speed-button.is-active {
        border-color: rgba(125, 211, 252, 0.9);
        color: #f8fafc;
        background: linear-gradient(130deg, rgba(56, 189, 248, 0.25), rgba(14, 116, 144, 0.55));
        box-shadow: 0 0 0 1px rgba(125, 211, 252, 0.25);
      }

      .speed-button.pause {
        border-color: rgba(251, 191, 36, 0.55);
        color: #fde68a;
        background: rgba(88, 63, 8, 0.35);
      }

      .speed-button.pause.is-active {
        border-color: rgba(251, 191, 36, 0.9);
        color: #fff7ed;
        background: rgba(120, 53, 15, 0.65);
      }

      .actions {
        display: flex;
        gap: 10px;
        margin-top: 14px;
      }

      .panel button {
        flex: 1;
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid rgba(125, 211, 252, 0.5);
        background: linear-gradient(130deg, rgba(37, 99, 235, 0.18), rgba(14, 116, 144, 0.35));
        color: #e6edf3;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        cursor: pointer;
      }

      .panel button:hover {
        border-color: rgba(148, 219, 255, 0.75);
      }

      .tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
      }

      .tab {
        flex: 1;
        border-radius: 999px;
        border: 1px solid rgba(93, 120, 156, 0.45);
        background: rgba(10, 18, 28, 0.7);
        color: rgba(216, 231, 246, 0.8);
        font-size: 10px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        padding: 6px 10px;
        cursor: pointer;
      }

      .tab.is-active {
        background: rgba(24, 44, 68, 0.9);
        color: rgba(214, 236, 255, 0.95);
        border-color: rgba(120, 160, 205, 0.6);
      }

      .tab-panel {
        display: none;
      }

      .tab-panel.is-active {
        display: block;
      }

      .hint {
        margin-top: 10px;
        font-size: 11px;
        color: rgba(230, 237, 243, 0.6);
      }

      @media (max-width: 720px) {
        .burger-button {
          top: 12px;
          left: 12px;
        }

        .burger-drawer {
          width: min(320px, 90vw);
          padding: 12px;
        }

        .debug-overlay {
          left: 8px;
          right: 8px;
          top: 8px;
          padding: 8px 10px;
          max-width: none;
          max-height: calc(100vh - 16px);
          font-size: 12px;
          white-space: pre-wrap;
          word-break: break-word;
        }

        .debug-overlay__toggle {
          right: 6px;
          top: 6px;
        }

        .debug-overlay__content {
          margin-top: 22px;
        }

        .menu-panel {
          width: min(360px, 92vw);
        }

        .panel {
          width: auto;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="galaxy"></canvas>
    <div id="marker-layer" class="marker-layer hidden"></div>
    <div id="label-layer" class="label-layer hidden"></div>
    <div id="menu-screen" class="menu-screen">
      <div class="panel menu-panel">
        <div class="menu-eyebrow">Main Menu</div>
        <h1>Stellar Fleet</h1>
        <p id="scenario-description">Loading scenario...</p>
        <label for="scenario-select">Scenario</label>
        <select id="scenario-select"></select>
        <label for="seed-input">Seed</label>
        <input id="seed-input" type="number" step="1" />
        <label>Vitesse simulation</label>
        <div class="speed-row" id="sim-speed-menu">
          <button class="speed-button" type="button" data-speed="1">x1</button>
          <button class="speed-button" type="button" data-speed="2">x2</button>
          <button class="speed-button" type="button" data-speed="4">x4</button>
          <button class="speed-button" type="button" data-speed="8">x8</button>
          <button class="speed-button" type="button" data-speed="16">x16</button>
          <button class="speed-button" type="button" data-speed="32">x32</button>
          <button class="speed-button" type="button" data-speed="64">x64</button>
          <button class="speed-button" type="button" data-speed="100">x100</button>
          <div class="speed-value" id="sim-speed-value-menu">x1</div>
        </div>
        <div class="actions">
          <button id="start-button" type="button">Launch Mission</button>
        </div>
        <div class="hint">Pinch or scroll to zoom. Double tap to focus. Drag to orbit. Two-finger drag to pan.</div>
      </div>
    </div>
    <div id="loading-screen" class="loading-screen hidden">
      <div class="panel menu-panel">
        <div class="menu-eyebrow">Loading</div>
        <h1>Stellar Fleet</h1>
        <p id="loading-stage">Preparing scenario...</p>
        <div class="loading-bar">
          <div id="loading-progress" class="loading-bar__fill"></div>
        </div>
      </div>
    </div>
    <button id="burger-button" class="burger-button hidden" type="button" aria-label="Open menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <div id="burger-backdrop" class="burger-backdrop hidden"></div>
    <div id="burger-drawer" class="burger-drawer hidden">
      <div class="panel slim">
        <div class="tabs">
          <button id="hud-tab-view" class="tab is-active" type="button">View</button>
          <button id="hud-tab-ships" class="tab" type="button">Ships</button>
        </div>
        <div id="hud-panel-view" class="tab-panel is-active">
          <label>Vitesse simulation</label>
          <div class="speed-row" id="sim-speed-hud">
            <button class="speed-button" type="button" data-speed="1">x1</button>
            <button class="speed-button" type="button" data-speed="2">x2</button>
            <button class="speed-button" type="button" data-speed="4">x4</button>
            <button class="speed-button" type="button" data-speed="8">x8</button>
            <button class="speed-button" type="button" data-speed="16">x16</button>
            <button class="speed-button" type="button" data-speed="32">x32</button>
            <button class="speed-button" type="button" data-speed="64">x64</button>
            <button class="speed-button" type="button" data-speed="100">x100</button>
          </div>
          <div class="speed-row">
            <button id="sim-pause-button" class="speed-button pause" type="button">Pause</button>
            <div class="speed-value" id="sim-speed-value-hud">x1</div>
          </div>
          <div class="actions">
            <button id="return-menu-button" type="button">Return to main menu</button>
          </div>
          <div class="hint">Close the drawer to resume simulation controls.</div>
        </div>
        <div id="hud-panel-ships" class="tab-panel">
          <label for="ship-select">Ship Focus</label>
          <select id="ship-select"></select>
          <div class="hint">Select a ship to focus the camera.</div>
        </div>
      </div>
    </div>
    <div id="debug-overlay" class="debug-overlay hidden">
      <button id="debug-overlay-toggle" class="debug-overlay__toggle" type="button">Hide</button>
      <pre id="debug-overlay-content" class="debug-overlay__content"></pre>
    </div>
    <script type="module" src="/client.js"></script>
  </body>
</html>
